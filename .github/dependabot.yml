version: 2
updates:
  # The actions the workflows in .github/workflows use, bumped together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The gems in Gemfile.lock.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      gems:
        patterns: ["*"]
    commit-message:
      prefix: build
