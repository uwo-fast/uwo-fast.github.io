name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # The lab signs and equipment records are cloned from uwo-fast/uwo-fast at
  # build time, so a change there does not reach this site until it rebuilds.
  # Printed QR codes point at these pages, and a code on a wall serving stale
  # safety guidance is worse than one that fails, so rebuild on a schedule as
  # well. repository_dispatch lets that repo push a rebuild immediately once a
  # token is available; the schedule is the floor, not the mechanism.
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [signs-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the project page script
        run: python3 -m unittest discover tests

      - name: Fetch project content
        run: ./scripts/fetch-projects.sh

      # Same script that runs locally, so a page cannot build here and 404 there.
      - name: Fetch lab signs and equipment records
        run: ./scripts/fetch-signs.sh

      - name: Build
        run: npm run build

      # The /signs/ and /equipment/ URLs are printed on QR codes in the lab.
      - name: Check required URLs
        run: npm run check-urls

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
