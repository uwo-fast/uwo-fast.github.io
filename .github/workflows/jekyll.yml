name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The lab signs and equipment records are cloned from uwo-fast/uwo-fast at
  # build time, so a change there does not reach this site until it rebuilds.
  # Printed QR codes point at these pages, and a code on a wall serving stale
  # safety guidance is worse than one that fails, so rebuild on a schedule as
  # well. repository_dispatch lets that repo push a rebuild immediately once a
  # token is available; the schedule is the floor, not the mechanism.
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [signs-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch project content
        run: |
          jq -r '.[] | .repo' _data/projects.json | while read -r repo; do
            dir=$(basename "$repo")
            git clone --depth 1 "https://github.com/${repo}.git" "_projects/${dir}"
          done
          find _projects -name "README.md" -execdir mv README.md index.md \;

      # Same script that runs locally, so a page cannot build here and 404 there.
      - name: Fetch lab signs and equipment records
        run: ./scripts/fetch-signs.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
