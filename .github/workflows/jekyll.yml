name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The lab signs and equipment records are cloned from uwo-fast/uwo-fast at
  # build time, so a change there does not reach this site until it rebuilds.
  # Printed QR codes point at these pages, and a code on a wall serving stale
  # safety guidance is worse than one that fails, so rebuild on a schedule as
  # well. repository_dispatch lets that repo push a rebuild immediately once a
  # token is available; the schedule is the floor, not the mechanism.
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [signs-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the project page script
        run: python3 -m unittest discover tests

      - name: Fetch project content
        run: ./scripts/fetch-projects.sh

      # Same script that runs locally, so a page cannot build here and 404 there.
      - name: Fetch lab signs and equipment records
        run: ./scripts/fetch-signs.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
